<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pocket Pixel</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <audio id="startup-sound" src="assets/startup.mp3" preload="auto"></audio>

    <div id="boot-screen">
        <img src="assets/gameboy.png" alt="Pocket Pixel Mascot" id="mascot">
        <div id="start-prompt" class="pulse-text">CLICK OR PRESS SPACE</div>
    </div>

    <div id="main-layout" style="display: none;">
        
        <div class="side-pane left-pane">
            <div class="dpad-grid">
                <button class="dpad-btn diag top-left"></button>
                <button class="dpad-btn dir up"></button>
                <button class="dpad-btn diag top-right"></button>
                
                <button class="dpad-btn dir left"></button>
                <div class="dpad-center"></div>
                <button class="dpad-btn dir right"></button>
                
                <button class="dpad-btn diag bottom-left"></button>
                <button class="dpad-btn dir down"></button>
                <button class="dpad-btn diag bottom-right"></button>
            </div>
            
            <div class="pill-btn-container">
                <button class="pill-btn">SELECT</button>
            </div>
        </div>

        <div class="center-pane">
            <div class="hotbar">
                <button>📂</button>
                <button>⏪</button>
                <button id="btn-pause">⏸️</button>
                <button>💾</button>
                <button>⏏️</button>
            </div>
            
            <div class="console-screen">
                <div class="cartridge-prompt pulse-text">INSERT CARTRIDGE</div>
            </div>
        </div>

        <div class="side-pane right-pane">
            <div class="settings-corner">
                <button id="settings-btn">⚙️</button>
            </div>
            <div class="action-btn-container">
                <button class="action-btn">B</button>
                <button class="action-btn" style="margin-top: -40px;">A</button>
            </div>
            <div class="pill-btn-container">
                <button class="pill-btn" id="btn-start">START</button>
            </div>
        </div>
    </div>

    <div id="settings-modal" style="display: none;">
        <div class="modal-content">
            <div class="modal-header">
                <h2>SETTINGS</h2>
                <button id="close-settings">X</button>
            </div>
            
            <div class="settings-section">
                <h3>AUDIO MIXER</h3>
                <div class="slider-group">
                    <label>CH1 (SQUARE 1) <input type="range" id="vol-ch1" min="0" max="1" step="0.1" value="1"></label>
                    <label>CH2 (SQUARE 2) <input type="range" id="vol-ch2" min="0" max="1" step="0.1" value="1"></label>
                    <label>CH3 (WAVE) <input type="range" id="vol-ch3" min="0" max="1" step="0.1" value="1"></label>
                    <label>CH4 (NOISE) <input type="range" id="vol-ch4" min="0" max="1" step="0.1" value="1"></label>
                </div>
            </div>

            <div class="settings-section">
                <h3>DMG THEMES</h3>
                <div class="theme-buttons">
                    <button class="theme-btn" data-theme="classic">CLASSIC</button>
                    <button class="theme-btn" data-theme="bw">POCKET B&W</button>
                    <button class="theme-btn" data-theme="virtual">VIRTUAL RED</button>
                </div>
            </div>
        </div>
    </div>

    <input type="file" id="rom-upload" accept=".gb,.gbc" style="display: none;">

    <script src="js/db.js"></script>
    <script src="js/engine.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/input.js"></script>
</body>
</html>
