<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pocket Pixel</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div id="power-screen">
        <div class="power-btn-text">CLICK TO POWER ON</div>
    </div>

    <div id="boot-screen">
        <img src="assets/gameboy.png" alt="Pocket Pixel Mascot" class="mascot" id="mascot-img">
    </div>

    <audio id="boot-sound" src="assets/splash.mp3"></audio>

    <div id="library-screen">
        <h1 class="app-title">Pocket Pixel</h1>

        <div class="list-section" id="liked-games">
            <h2>Liked Games</h2>
            <div class="placeholder-text">No liked games yet...</div>
        </div>

        <div class="list-section" id="recent-games">
            <h2>Recently Played</h2>
            <div class="placeholder-text">Play a game to see it here...</div>
        </div>

        <div class="list-section" id="all-games">
            <h2>All Games</h2>
            <div class="placeholder-text">Waiting for ROM directory...</div>
        </div>
    </div>

    <script>
        const powerScreen = document.getElementById('power-screen');
        const bootScreen = document.getElementById('boot-screen');
        const mascot = document.getElementById('mascot-img');
        const bootSound = document.getElementById('boot-sound');
        const libraryScreen = document.getElementById('library-screen');

        // Wait for the user to click the screen to start the app
        powerScreen.addEventListener('click', () => {
            
            // 1. Hide the power screen and show the boot screen
            powerScreen.style.display = 'none';
            bootScreen.style.display = 'flex';

            // 2. Play the sound immediately (browser allows this now!)
            bootSound.play();

            // 3. Trigger the CSS slide animation
            // A tiny timeout ensures the display:flex renders before the CSS transform starts
            setTimeout(() => {
                mascot.classList.add('slide-up');
            }, 50);

            // 4. Automatically transition to the library when the boot sequence is over
            // (Adjust 2500ms to perfectly match your startup.mp3 length)
            setTimeout(() => {
                bootScreen.style.opacity = '0';
                
                setTimeout(() => {
                    bootScreen.style.display = 'none';
                    libraryScreen.style.display = 'flex';
                }, 500); 
                
            }, 2500); 
        });
    </script>
</body>
</html>
