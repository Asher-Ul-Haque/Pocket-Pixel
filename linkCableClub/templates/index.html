<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Link Cable Club</title>
    <style>
        :root {
            --green: #8bac0f;
            --dark-green: #306230;
            --black: #0f380f;
        }
        body {
            font-family: 'Courier New', Courier, monospace;
            background-color: var(--green);
            color: var(--black);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .club-modal {
            background-color: var(--dark-green);
            padding: 4px;
            border-radius: 8px;
            width: 320px;
            box-shadow: 8px 8px 0px rgba(0,0,0,0.3);
        }
        .inner-screen {
            background-color: var(--green);
            padding: 20px;
            text-align: center;
            border: 2px solid var(--black);
        }
        .icon { font-size: 2rem; margin-bottom: 10px; }
        .status { font-weight: bold; margin-bottom: 20px; text-transform: uppercase;}
        .room-code { font-size: 2rem; letter-spacing: 4px; font-weight: bold; margin: 15px 0; }
        input[type="text"] {
            width: 80%;
            padding: 8px;
            font-family: inherit;
            font-size: 1rem;
            text-align: center;
            text-transform: uppercase;
            border: 2px solid var(--black);
            background: #e0f8d0;
            margin-bottom: 10px;
        }
        button {
            background-color: var(--black);
            color: var(--green);
            border: none;
            padding: 10px 20px;
            font-family: inherit;
            font-size: 1rem;
            cursor: pointer;
            width: 100%;
            margin-bottom: 10px;
            text-transform: uppercase;
        }
        button:hover { background-color: #1a4f1a; }
        button.danger { background-color: #8b2c0f; color: #ffcccc;}
        button.danger:hover { background-color: #6a1c07; }
        
        .hidden { display: none !important; }

        /* --- NEW BYTE TERMINAL STYLES --- */
        #byte-log {
            background-color: var(--black);
            color: var(--green);
            height: 120px;
            overflow-y: auto;
            text-align: left;
            padding: 8px;
            font-size: 0.85rem;
            border: 2px solid var(--dark-green);
            margin-bottom: 15px;
        }
        .log-sent { color: #fff; }
        .log-recv { color: #8bac0f; font-weight: bold; }
        
        .byte-controls {
            display: flex;
            gap: 5px;
            margin-bottom: 15px;
        }
        .byte-controls input {
            width: 50%;
            margin: 0;
        }
        .byte-controls button {
            width: 50%;
            margin: 0;
        }
    </style>
</head>
<body>

<div class="club-modal">
    <div class="inner-screen">
        <div class="icon" id="ui-icon">🔗</div>
        <div class="status" id="ui-status">Link Cable Club</div>

        <div id="view-idle">
            <input type="text" id="join-input" placeholder="ENTER 5-LETTER CODE" maxlength="5">
            <button id="btn-join">Join Room</button>
            <div style="margin: 10px 0; font-size: 0.8rem;">- OR -</div>
            <button id="btn-create">Create Room</button>
        </div>

        <div id="view-waiting" class="hidden">
            <div style="font-size: 0.9rem;">YOUR ROOM CODE:</div>
            <div class="room-code" id="display-code">----</div>
            <div style="font-size: 0.8rem; margin-bottom: 15px;">Give this to your friend!</div>
        </div>

        <div id="view-connected" class="hidden">
            <div id="byte-log"></div>
            <div class="byte-controls">
                <input type="text" id="byte-input" placeholder="HEX (e.g. FF)" maxlength="2">
                <button id="btn-send-byte">Send</button>
            </div>
        </div>

        <div id="error-msg" style="color: #8b2c0f; font-weight: bold; margin: 10px 0; font-size: 0.8rem;"></div>

        <button id="btn-disconnect" class="danger hidden">Unplug Cable</button>
    </div>
</div>

<script>
    let ws = null;
    const protocol = window.location.protocol === "https:" ? "wss" : "ws";
    const host = window.location.host;

    // UI Elements
    const viewIdle = document.getElementById('view-idle');
    const viewWaiting = document.getElementById('view-waiting');
    const viewConnected = document.getElementById('view-connected');
    const btnDisconnect = document.getElementById('btn-disconnect');
    const statusText = document.getElementById('ui-status');
    const displayCode = document.getElementById('display-code');
    const errorMsg = document.getElementById('error-msg');
    const uiIcon = document.getElementById('ui-icon');
    const byteLog = document.getElementById('byte-log');

    function logTerminal(message, typeClass) {
        const entry = document.createElement('div');
        entry.className = typeClass;
        entry.innerText = `> ${message}`;
        byteLog.appendChild(entry);
        byteLog.scrollTop = byteLog.scrollHeight; // Auto-scroll to bottom
    }

    function setUIState(state) {
        errorMsg.innerText = "";
        if (state === 'IDLE') {
            viewIdle.classList.remove('hidden');
            viewWaiting.classList.add('hidden');
            viewConnected.classList.add('hidden');
            btnDisconnect.classList.add('hidden');
            statusText.innerText = "Link Cable Club";
            uiIcon.innerText = "🔗";
            if (ws) { ws.close(); ws = null; }
            byteLog.innerHTML = ""; // Clear log on disconnect
        } 
        else if (state === 'WAITING') {
            viewIdle.classList.add('hidden');
            viewWaiting.classList.remove('hidden');
            viewConnected.classList.add('hidden');
            btnDisconnect.classList.remove('hidden');
            statusText.innerText = "Waiting for Player 2...";
            uiIcon.innerText = "⏳";
        } 
        else if (state === 'CONNECTED') {
            viewIdle.classList.add('hidden');
            viewWaiting.classList.add('hidden');
            viewConnected.classList.remove('hidden');
            btnDisconnect.classList.remove('hidden');
            statusText.innerText = "Cable Connected!";
            uiIcon.innerText = "✅";
            logTerminal("SYSTEM: VIRTUAL CABLE ENGAGED", "log-recv");
        }
    }

    function initWebSocket() {
        if (ws) return;
        ws = new WebSocket(`${protocol}://${host}/ws`);
        
        // CRITICAL: Tells browser to give us raw ArrayBuffers, not Blobs or Strings
        ws.binaryType = "arraybuffer"; 
        
        ws.onmessage = (event) => {
            // --- HANDLE JSON SIGNALING ---
            if (typeof event.data === "string") {
                const data = JSON.parse(event.data);
                
                if (data.type === "created") {
                    displayCode.innerText = data.code;
                    setUIState('WAITING');
                } 
                else if (data.type === "connected") {
                    setUIState('CONNECTED');
                } 
                else if (data.type === "error") {
                    setUIState('IDLE');
                    errorMsg.innerText = data.message;
                } 
                else if (data.type === "peer_disconnected") {
                    setUIState('IDLE');
                    errorMsg.innerText = "The other player unplugged the cable.";
                }
            } 
            // --- HANDLE RAW BINARY PAYLOADS ---
            else if (event.data instanceof ArrayBuffer) {
                const view = new Uint8Array(event.data);
                if (view.length > 0) {
                    const hexStr = view[0].toString(16).toUpperCase().padStart(2, '0');
                    logTerminal(`RECV: 0x${hexStr}`, "log-recv");
                }
            }
        };

        ws.onclose = () => setUIState('IDLE');
    }

    document.getElementById('btn-create').addEventListener('click', () => {
        initWebSocket();
        ws.onopen = () => ws.send(JSON.stringify({ action: "create" }));
    });

    document.getElementById('btn-join').addEventListener('click', () => {
        const code = document.getElementById('join-input').value;
        if (!code) { errorMsg.innerText = "ENTER A CODE FIRST"; return; }
        
        initWebSocket();
        ws.onopen = () => ws.send(JSON.stringify({ action: "join", code: code }));
    });

    document.getElementById('btn-disconnect').addEventListener('click', () => {
        if (ws) ws.send(JSON.stringify({ action: "disconnect" }));
        setUIState('IDLE');
    });

    // --- RAW BYTE TRANSMITTER ---
    document.getElementById('btn-send-byte').addEventListener('click', () => {
        const inputField = document.getElementById('byte-input');
        const hexVal = inputField.value.trim();
        
        // Validate it's a real hex number
        const parsedByte = parseInt(hexVal, 16);
        if (isNaN(parsedByte) || parsedByte < 0 || parsedByte > 255) {
            inputField.value = "";
            return;
        }

        if (ws && ws.readyState === WebSocket.OPEN) {
            // Package the number into a 1-byte TypedArray
            const payload = new Uint8Array([parsedByte]);
            ws.send(payload); // Sends as raw binary
            
            const formatHex = parsedByte.toString(16).toUpperCase().padStart(2, '0');
            logTerminal(`SENT: 0x${formatHex}`, "log-sent");
            inputField.value = "";
        }
    });

    // Allow pressing "Enter" in the byte input field
    document.getElementById('byte-input').addEventListener('keypress', (e) => {
        if (e.key === 'Enter') document.getElementById('btn-send-byte').click();
    });
</script>

</body>
</html>
